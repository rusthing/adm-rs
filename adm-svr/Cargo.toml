[package]
name = "adm-svr"
version = "1.0.0"
edition = "2024"
authors = ["zbz"]
license = "MIT"
keywords = ["admin", "rbac", "user", "role", "menu"]
description = "A Rust-based admin management service. Provides user / role / menu CRUD over RESTful APIs, built on robotech."
categories = ["web-programming::http-server"]
homepage = "https://github.com/rusthing/adm"
repository = "https://github.com/rusthing/adm"
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"] }
config = { workspace = true }
chrono = { workspace = true }
derive_setters = { workspace = true }
typed-builder = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = { workspace = true }
axum = { workspace = true, features = ["macros", "multipart"] }
sqlx = { workspace = true, features = ["runtime-tokio", "any", "all-databases"] }
sea-orm = { workspace = true, features = ["sqlx-all", "runtime-tokio-rustls", "debug-print"] }
linkme = { workspace = true }
regex = { workspace = true }
o2o = { workspace = true }
validator = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive"] }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["axum", "vendored"] }
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }

wheel-rs = { workspace = true }
idworker = { workspace = true, features = ["utils"] }
# distributed-cache：令牌黑名单走 RedisCache（登出即失效），隐含 redis
robotech = { workspace = true, features = ["db", "config-center", "registry-center", "macros", "redis", "distributed-cache"] }
adm-api = { workspace = true, features = ["server"] }
